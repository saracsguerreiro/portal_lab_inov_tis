# Ambiente local completo com um só comando: `docker compose up`
# App em http://localhost:3000 · Emails em http://localhost:8025 · MinIO em http://localhost:9001
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: eco, POSTGRES_PASSWORD: eco, POSTGRES_DB: ecossistema }
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eco"], interval: 3s, retries: 20 }
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: eco, MINIO_ROOT_PASSWORD: eco-secret-123 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "sleep 3; mc alias set s3 http://minio:9000 eco eco-secret-123 && mc mb -p s3/ecossistema-privado && mc anonymous set none s3/ecossistema-privado"]
  mail:
    image: axllent/mailpit:v1.24
    ports: ["8025:8025", "1025:1025"]
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env.docker]
    ports: ["3000:3000"]
    command: sh -c "npx prisma db push --skip-generate && npx tsx prisma/seed.ts && npm start"
  worker:
    build: .
    depends_on:
      db: { condition: service_healthy }
    env_file: [.env.docker]
    command: sh -c "sleep 15 && npm run worker"
volumes: { db: {}, s3: {} }
